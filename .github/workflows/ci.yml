name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

defaults:
  run:
    working-directory: Paubox_Java/paubox-java

jobs:
  build:
    name: build (jdk ${{ matrix.jdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: ["11", "17", "21"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven

      - name: Compile the SDK
        run: mvn -B --no-transfer-progress compile

      - name: Compile the test sources and run the offline ones
        # `test` compiles every test here, which catches signature drift between
        # the SDK and its own tests, and runs the offline suites (*Test.java).
        # The live suites (Test*.java) read config.properties and call the real
        # API, so surefire excludes them; see the pom.
        run: mvn -B --no-transfer-progress test

      - name: Assert the offline tests actually ran
        # Surefire reports success when its include pattern matches nothing, so
        # a green build is not by itself evidence that a test executed. Floors,
        # not targets.
        run: |
          ran=$(grep -ho 'tests="[0-9]*"' target/surefire-reports/*.xml \
            | grep -o '[0-9]*' | awk '{total += $1} END {print total + 0}')
          echo "tests_run=${ran:-0}"
          if [ "${ran:-0}" -lt 15 ]; then
            echo "FAIL: expected at least 15 offline tests to run" >&2
            exit 1
          fi
          echo "OK: ran $ran offline tests"

      - name: Assert the build produced classes
        # "Nothing to compile" also exits 0, so a green build is not by itself
        # evidence that anything was built. Floors, not targets.
        run: |
          main=$(find target/classes -name '*.class' | wc -l)
          tests=$(find target/test-classes -name '*.class' | wc -l)
          echo "main_classes=$main test_classes=$tests"
          if [ "$main" -lt 30 ] || [ "$tests" -lt 3 ]; then
            echo "FAIL: expected at least 30 main and 3 test classes" >&2
            exit 1
          fi
          echo "OK: compiled $main main and $tests test classes"

      - name: Package the assembly jar
        # The release workflow attaches this jar to the GitHub release, and that
        # job only runs *after* a tag exists — so a packaging failure would be
        # discovered with the release already cut. Building it here means the
        # assembly is proven on every PR instead.
        run: mvn -B --no-transfer-progress -DskipTests package

      - name: Assert the jar exists and contains the SDK
        run: |
          jar=target/Paubox.Email.API.jar
          test -f "$jar" || { echo "FAIL: $jar was not produced" >&2; exit 1; }
          classes=$(unzip -l "$jar" | grep -c 'com/paubox/.*\.class' || true)
          echo "jar=$jar classes=$classes size=$(stat -c%s "$jar")"
          if [ "$classes" -lt 30 ]; then
            echo "FAIL: expected at least 30 com/paubox classes in the jar" >&2
            exit 1
          fi
          echo "OK: $jar contains $classes SDK classes"
