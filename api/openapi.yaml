            content:
              text/html: text/html
              text/plain: text/plain
      properties:
        data:
          $ref: "#/components/schemas/BulkSendRequest_data"
      required:
      - data
      type: object
    Message:
      example:
        cc:
        - cc
        - cc
        headers:
          List-Unsubscribe-Post: List-Unsubscribe-Post
          subject: subject
          List-Unsubscribe: List-Unsubscribe
          from: from
          x-custom-header: x-custom-header
          additionalProperties: additionalProperties
          reply-to: reply-to
        bcc:
        - bcc
        - bcc
        attachments:
        - fileName: fileName
          contentType: contentType
          content: content
        - fileName: fileName
          contentType: contentType
          content: content
        allowNonTLS: false
        recipients:
        - recipients
        - recipients
        forceSecureNotification: false
        content:
          text/html: text/html
          text/plain: text/plain
      properties:
        recipients:
          items:
            description: "Email address, optionally with display name (e.g., \"J.\
              \ Smith <jsmith@host.com>\")."
            type: string
          minItems: 1
          type: array
        bcc:
          items:
            type: string
          type: array
        cc:
          items:
            type: string
          type: array
        headers:
          $ref: "#/components/schemas/MessageHeaders"
        allowNonTLS:
          default: false
          description: |
            Allow delivery over non-TLS rather than converting to a Secure Portal message. Not HIPAA-compliant if the message contains PHI.
          type: boolean
        forceSecureNotification:
          default: false
          description: |
            Force delivery as a Paubox Secure Message; recipient gets a pickup notification with a link.
          type: boolean
        content:
          $ref: "#/components/schemas/MessageContent"
        attachments:
          items:
