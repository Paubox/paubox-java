          type: string
        List-Unsubscribe-Post:
          description: Used in conjunction with List-Unsubscribe header.
          type: string
        x-custom-header:
          description: Example custom header; any custom header may be added with
            an X- prefix.
          type: string
        additionalProperties:
          description: Any additional X- prefixed custom header values.
          type: string
      required:
      - from
      - subject
      type: object
    MessageContent:
      example:
        text/html: text/html
        text/plain: text/plain
      nullable: true
      oneOf: []
      properties:
        text/plain:
          description: Plain text message body. Required if text/html is not provided.
