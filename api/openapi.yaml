openapi: 3.0.0
info:
  description: |
    Public documentation for Paubox's Transactional Email API

    ## Authentication

    **IMPORTANT**: This API uses a custom authentication format that requires the "Token token=" prefix.

    All requests must include the Authorization header in this exact format:
    ```
    Authorization: Token token=YOUR_API_KEY
    ```

    **Note for Code Generation Tools**: Auto-generated code from this specification may need to be modified to include the "Token token=" prefix, as most generators expect standard Bearer token format.
  title: Paubox Email API
  version: 1.0.0
servers:
- description: Paubox Email API
  url: "https://api.paubox.net/v1/{api_username}"
  variables:
    api_username:
      default: YOUR_API_USERNAME
      description: Your Paubox Email API endpoint username
- description: SwaggerHub API Auto Mocking
  url: https://virtserver.swaggerhub.com/paubox/transactional_email/1.0.0
security:
- PauboxToken: []
tags:
- description: Send individual or bulk transactional email
  name: Messages
- description: Manage and use dynamic Handlebars templates for email content
  name: Dynamic Templates
paths:
  /messages:
    post:
      operationId: sendMessage
      requestBody:
        content:
          application/json:
            examples:
              basic:
                description: |
                  **CURL Example:**
                  ```bash
                  curl --request POST \
                    --url https://api.paubox.net/v1/YOUR_API_USERNAME/messages \
                    --header 'Authorization: Token token=YOUR_API_KEY' \
                    --header 'Content-Type: application/json' \
                    --data '{"data":{"message":{"recipients":["recipient@host.com"],"headers":{"subject":"Hello from the Paubox Email API","from":"sender@verifieddomain.com"},"content":{"text/plain":"Hello world","text/html":"<html><body><h1>Hello world</h1></body></html>"}}}}'
                  ```
                summary: Minimal text+HTML example
                value:
                  data:
                    message:
                      recipients:
                      - recipient@host.com
                      headers:
                        subject: Hello from the Paubox Email API
                        from: sender@verifieddomain.com
                      content:
                        text/plain: Hello world
                        text/html: <html><body><h1>Hello world</h1></body></html>
              full:
                summary: "Full example with bcc, reply-to, custom header, attachment,\
                  \ and overrides"
                value:
                  data:
                    message:
                      recipients:
                      - recipient@host.com
                      - Recipient Name <recipient2@host.com>
                      bcc:
                      - recipient3@host.com
                      - Recipient Name <recipient4@host.com>
                      cc:
                      - cc.name <cc@example.com>
                      headers:
                        subject: sample email
                        from: sender@authorized_domain.com
                        reply-to: Sender Name <sender@authorized_domain.com>
                        x-custom-header: sample custom header
                        List-Unsubscribe: <mailto:unsubscribe@yourdomain.com?subject=unsubscribe>
                      content:
                        text/plain: Hello World!
                        text/html: <html><body><h1>Hello World!</h1></body></html>
                      attachments:
                      - fileName: hello_world.txt
                        contentType: text/plain
                        content: SGVsbG8gV29ybGQh
                    override_open_tracking: true
                    override_link_tracking: true
                    unsubscribe_url: https://your_url_here.com
            schema:
              $ref: "#/components/schemas/SingleSendRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                ok:
                  value:
                    sourceTrackingId: 3d38ab13-0af8-4028-bd45-52e882e0d584
                    customHeaders:
                      X-Custom-Header: value
                    data: Service OK
              schema:
                $ref: "#/components/schemas/SingleSendResponse"
          description: Message accepted
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad request
      security:
      - PauboxToken: []
      summary: Send a single email message
      tags:
      - Messages
      x-content-type: application/json
      x-accepts:
      - application/json
  /bulk_messages:
    post:
      description: |
        Sends multiple messages in one request. Paubox recommends batches of 50 or fewer. Source tracking IDs are returned in the same order as the messages array.
      operationId: sendBulkMessages
      requestBody:
        content:
          application/json:
            examples:
              twoMessages:
                summary: Two-message batch
                value:
                  data:
                    messages:
                    - recipients:
                      - recipient@host.com
                      - Recipient Name <recipient@host.com>
                      bcc:
                      - recipient3@host.com
                      - Recipient Name <recipient4@host.com>
                      headers:
                        subject: sample email
                        from: sender@authorized_domain.com
                        reply-to: Sender Name <sender@authorized_domain.com>
                        x-custom-header: sample custom header
                      content:
                        text/plain: Hello World!
                        text/html: <html><body><h1>Hello World!</h1></body></html>
                      attachments:
                      - fileName: hello_world.txt
                        contentType: text/plain
                        content: SGVsbG8gV29ybGQh
                      allowNonTLS: false
                      forceSecureNotification: false
                    - recipients:
                      - recipient2@host.com
                      - Recipient Name <recipient2@host.com>
                      headers:
                        subject: sample email
                        from: sender@authorized_domain.com
                        reply-to: Sender Name <sender@authorized_domain.com>
                      content:
                        text/plain: Hello World!
                        text/html: <html><body><h1>Hello World!</h1></body></html>
                      attachments:
                      - fileName: hello_world.txt
                        contentType: text/plain
                        content: SGVsbG8gV29ybGQh
            schema:
              $ref: "#/components/schemas/BulkSendRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                ok:
                  value:
                    messages:
                    - sourceTrackingId: 3d38ab13-0af8-4028-bd45-999999999999
                      customHeaders:
                        X-Custom-Header: value
                      data: Service OK
                    - sourceTrackingId: 3d38ab13-0af8-4028-bd45-000000000000
                      customHeaders:
                        X-Custom-Header: value
                      data: Service OK
              schema:
                $ref: "#/components/schemas/BulkSendResponse"
          description: Batch accepted
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad request
      security:
      - PauboxToken: []
      summary: Send multiple email messages (batch)
      tags:
      - Messages
      x-content-type: application/json
      x-accepts:
      - application/json
  /message_receipt:
    get:
      description: "Retrieve delivery status, open tracking, and click tracking information\
        \ for a sent message"
      operationId: getMessageReceipt
      parameters:
      - description: The tracking ID returned when the message was sent
        explode: true
        in: query
        name: sourceTrackingId
        required: true
        schema:
          example: 6e1cf9a4-7bde-4834-8200-ed424b50c8a7
          format: uuid
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                delivered:
                  summary: Delivered message with open and click tracking
                  value:
                    sourceTrackingId: 6e1cf9a4-7bde-4834-8200-ed424b50c8a7
                    data:
                      message:
                        id: <f4a9b518-439c-497d-b87f-dfc9cc19194b@authorized_domain.com>
                        message_deliveries:
                        - recipient: recipient@host.com
                          status:
                            deliveryStatus: delivered
                            deliveryTime: "Mon, 23 Apr 2018 13:27:34 -0700"
                            openedStatus: opened
                            openedTime: "Mon, 23 Apr 2018 13:27:51 -0700"
                        total_opens: 1
                        distinct_opens: 1
                        total_click_count: 2
                        clicks_per_link:
                        - click_count: 1
                          target_url: amazon.com
                        - click_count: 1
                          target_url: ebay.com
                        unsubscribed: false
              schema:
                $ref: "#/components/schemas/MessageReceiptResponse"
          description: Message disposition data
        "404":
          content:
            application/json:
              examples:
                notFound:
                  summary: Message not found
                  value:
                    errors:
                    - code: 404
                      title: Message was not found
                      details: Message with this tracking id was not found
                    sourceTrackingId: 6e1cf9a4-7bde-4834-8d200-ed424b50c8a7
              schema:
                $ref: "#/components/schemas/MessageReceiptErrorResponse"
          description: Message not found
      security:
      - PauboxToken: []
      summary: Get email disposition
      tags:
      - Messages
      x-accepts:
      - application/json
  /dynamic_templates:
    get:
      description: Retrieve all dynamic templates for your organization
      operationId: listDynamicTemplates
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DynamicTemplateListResponse"
          description: List of templates
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad request
      security:
      - PauboxToken: []
      summary: List all dynamic templates
      tags:
      - Dynamic Templates
      x-accepts:
      - application/json
    post:
      description: Upload a new Handlebars template for dynamic content generation
      operationId: createDynamicTemplate
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/createDynamicTemplate_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DynamicTemplateResponse"
          description: Template created successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad request
      security:
      - PauboxToken: []
      summary: Create a dynamic template
      tags:
      - Dynamic Templates
      x-content-type: multipart/form-data
      x-accepts:
      - application/json
  /dynamic_templates/{id}:
    delete:
      description: Delete a specific dynamic template by ID
      operationId: deleteDynamicTemplate
      parameters:
      - description: Template ID to delete
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/deleteDynamicTemplate_200_response"
          description: Template deleted successfully
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Template not found
      security:
      - PauboxToken: []
      summary: Delete a dynamic template
      tags:
      - Dynamic Templates
      x-accepts:
      - application/json
    get:
      description: Retrieve a specific dynamic template by ID
      operationId: getDynamicTemplate
      parameters:
      - description: Template ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DynamicTemplateResponse"
          description: Template details
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Template not found
      security:
      - PauboxToken: []
      summary: Get a dynamic template
      tags:
      - Dynamic Templates
      x-accepts:
      - application/json
    patch:
      description: Update an existing Handlebars template
      operationId: updateDynamicTemplate
      parameters:
      - description: Template ID to update
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/updateDynamicTemplate_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DynamicTemplateResponse"
          description: Template updated successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Template not found
      security:
      - PauboxToken: []
      summary: Update a dynamic template
      tags:
      - Dynamic Templates
      x-content-type: multipart/form-data
      x-accepts:
      - application/json
  /templated_messages:
    post:
      description: Send an email using a dynamic template with variable substitution
      operationId: sendTemplatedMessage
      requestBody:
        content:
          application/json:
            examples:
              basic:
                summary: Basic templated message
                value:
                  data:
                    template_name: detailed_test
                    template_values: "{ \"name\": \"Howard\", \"conditional\":\"true\"\
                      ,\"items\":[\"one\",\"two\",\"three\"] }"
                    message:
                      recipients:
                      - recipient@host.com
                      - Recipient Name <recipient2@host.com>
                      bcc:
                      - recipient3@host.com
                      - Recipient Name <recipient4@host.com>
                      headers:
                        subject: sample email
                        from: sender@authorized_domain.com
                        reply-to: Sender Name <sender@authorized_domain.com>
                      allowNonTLS: false
                      forceSecureNotification: false
                      attachments:
                      - fileName: hello_world.txt
                        contentType: text/plain
                        content: SGVsbG8gV29ybGQ
            schema:
              $ref: "#/components/schemas/TemplatedMessageRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                success:
                  value:
                    sourceTrackingId: 3d38ab13-0af8-4028-bd45-XXXXXXXXXXXX
                    data: Service OK
              schema:
                $ref: "#/components/schemas/SingleSendResponse"
          description: Templated message sent successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad request
      security:
      - PauboxToken: []
      summary: Send a dynamically templated message
      tags:
      - Dynamic Templates
      x-content-type: application/json
      x-accepts:
      - application/json
