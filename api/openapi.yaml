              subject: subject
              List-Unsubscribe: List-Unsubscribe
              from: from
              x-custom-header: x-custom-header
              additionalProperties: additionalProperties
              reply-to: reply-to
            bcc:
            - bcc
            - bcc
            attachments:
            - fileName: fileName
              contentType: contentType
              content: content
            - fileName: fileName
              contentType: contentType
              content: content
            allowNonTLS: false
            recipients:
            - recipients
            - recipients
            forceSecureNotification: false
            content:
              text/html: text/html
              text/plain: text/plain
          unsubscribe_url: https://openapi-generator.tech
      properties:
