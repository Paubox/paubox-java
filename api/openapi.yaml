        - code: 0
          details: details
          title: title
        - code: 0
          details: details
          title: title
      properties:
        errors:
          items:
            $ref: "#/components/schemas/ErrorResponse_errors_inner"
          type: array
        sourceTrackingId:
          description: The tracking ID for the message
          example: 6e1cf9a4-7bde-4834-8d200-ed424b50c8a7
          type: string
      required:
      - errors
      - sourceTrackingId
      type: object
    MessageDelivery:
      example:
        recipient: recipient@host.com
        status:
          deliveryTime: "Mon, 23 Apr 2018 13:27:34 -0700"
          openedStatus: opened
          openedTime: "Mon, 23 Apr 2018 13:27:51 -0700"
          deliveryStatus: delivered
      properties:
        recipient:
          description: The recipient email address
          example: recipient@host.com
          type: string
        status:
          $ref: "#/components/schemas/DeliveryStatus"
      required:
      - recipient
      - status
      type: object
    DeliveryStatus:
      example:
        deliveryTime: "Mon, 23 Apr 2018 13:27:34 -0700"
        openedStatus: opened
        openedTime: "Mon, 23 Apr 2018 13:27:51 -0700"
        deliveryStatus: delivered
      properties:
        deliveryStatus:
          description: The delivery status of the message
          enum:
          - processing
          - "TLS not offered, sending via Secure Portal"
          - soft bounced
          - soft bounced - mailbox full
          - hard bounced
          - Internal error. Please check back later.
          - delivered
          - delivered via secure portal
          example: delivered
          type: string
        deliveryTime:
          description: The time when the message was delivered (if applicable)
          example: "Mon, 23 Apr 2018 13:27:34 -0700"
          type: string
        openedStatus:
          description: Whether the message was opened (single recipient only)
          enum:
          - opened
          - not opened
          example: opened
          type: string
        openedTime:
          description: The time when the message was first opened (single recipient
            only)
          example: "Mon, 23 Apr 2018 13:27:51 -0700"
          type: string
      required:
      - deliveryStatus
      type: object
    ClickData:
      example:
        target_url: amazon.com
        click_count: 1
      properties:
        click_count:
          description: Number of clicks on this specific link
          example: 1
